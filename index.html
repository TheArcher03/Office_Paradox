<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Office Paradox</title>
  <style>
    :root { --ink: #e9e6df; --dim: #9c9a94; --bg: #0d0d0f; --accent: #e9e6df; color-scheme: dark; }
    html, body { margin: 0; height: 100%; background: var(--bg); overflow: hidden; font-family: "Courier New", Courier, monospace; color: var(--ink); }
    #app { position: fixed; inset: 0; }
    canvas { display: block; }
    #crosshair { position: fixed; left: 50%; top: 50%; width: 6px; height: 6px; margin: -3px 0 0 -3px; border-radius: 50%; background: rgba(240,238,230,0.75); box-shadow: 0 0 2px rgba(0,0,0,0.6); transition: transform 0.12s, background 0.12s; pointer-events: none; }
    #crosshair.hot { transform: scale(2.1); background: rgba(255,255,255,0.95); }
    #overlay { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: rgba(8,8,10,0.86); cursor: pointer; z-index: 5; padding: 16px; box-sizing: border-box; }
    #overlay .card { max-width: 440px; text-align: center; }
    #overlay h1 { font-weight: normal; font-size: 30px; letter-spacing: 0.32em; margin: 0 0 6px; }
    #overlay .sub { color: var(--dim); font-size: 13px; letter-spacing: 0.2em; margin-bottom: 30px; }
    #overlay .go { display: inline-block; border: 1px solid var(--ink); padding: 10px 22px; letter-spacing: 0.24em; font-size: 14px; margin-bottom: 28px; }
    #overlay table { margin: 0 auto; font-size: 12.5px; color: var(--dim); border-collapse: collapse; text-align: left; }
    #overlay td { padding: 3px 10px; }
    #overlay td:first-child { color: var(--ink); text-align: right; white-space: nowrap; }
    #debug { position: fixed; right: 12px; top: 12px; background: rgba(10,10,12,0.82); border: 1px solid #444; padding: 10px 12px; font-size: 12px; display: none; z-index: 6; min-width: 220px; }
    #debug button { font: inherit; color: var(--ink); background: none; border: 1px solid #666; padding: 5px 10px; cursor: pointer; width: 100%; }
    #debug label { display: block; margin-bottom: 4px; }
    #debug input { width: 100%; }
    #debug .row { margin-bottom: 10px; }
    #debug .muted { color: var(--dim); }
  </style>
</head>
<body>
  <div id="app"></div>
  <div id="crosshair"></div>
  <div id="debug">
    <div class="row"><label>Color <span id="satVal"></span></label><input id="sat" type="range" min="0" max="1" step="0.01" /></div>
    <div class="row"><label>Throw strength <span id="powerVal"></span></label><input id="power" type="range" min="0.6" max="1.6" step="0.05" /></div>
    <div class="row"><button id="reset">Reset the room</button></div>
    <div class="row muted" id="dbgInfo"></div>
    <div class="muted">Esc frees the mouse · ` to close</div>
  </div>
  <div id="overlay">
    <div class="card">
      <h1>OFFICE PARADOX</h1>
      <div class="sub">PROTOTYPE · STAGE 1 · THE BOX · v4</div>
      <div class="go">CLICK TO CLOCK IN</div>
      <table>
        <tr><td>Mouse</td><td>Look around (the chair spins with you)</td></tr>
        <tr><td>Click</td><td>Use your hands</td></tr>
        <tr><td>Right-click</td><td>Put it down</td></tr>
        <tr><td>Arrow keys</td><td>Look (if the mouse won't lock)</td></tr>
        <tr><td>Esc</td><td>Pause</td></tr>
        <tr><td>`</td><td>Debug: color, throw strength, reset</td></tr>
      </table>
    </div>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
